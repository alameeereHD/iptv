<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بث مباشر</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="player-wrapper">
    <div id="player-container">
      <video id="video-player" autoplay muted playsinline></video>
      <div id="controls">
        <div id="controls-left">
          <button id="btn-play" onclick="togglePlay()">▶</button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" />
        </div>
        <div id="controls-right">
          <div id="quality-wrapper">
            <button id="btn-quality" onclick="toggleQualityMenu()">⚙ جودة</button>
            <div id="quality-menu" class="hidden"></div>
          </div>
          <button id="btn-fullscreen" onclick="toggleFullscreen()">⛶</button>
        </div>
      </div>
      <div id="channel-label"></div>
    </div>
  </div>
  <div id="channels-bar"></div>
  <script src="proxy.js"></script>
  <script src="channels.js"></script>
  <script src="player.js"></script>
</body>
</html>
