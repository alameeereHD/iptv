<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشغل القنوات المباشرة</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="player-wrapper">
    <div id="player-container">
      <video id="video" autoplay playsinline></video>
      <div id="overlay">
        <p id="overlay-text">اختر قناة من القائمة أدناه</p>
      </div>
      <div id="controls">
        <div id="ctrl-left">
          <button onclick="togglePlay()" id="btn-play">⏸</button>
          <input type="range" id="vol" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" />
        </div>
        <div id="ctrl-right">
          <div id="quality-wrap">
            <button onclick="toggleQuality()" id="btn-quality">⚙ جودة</button>
            <div id="quality-menu"></div>
          </div>
          <button onclick="toggleFS()">⛶</button>
          <span id="status-badge">متوقف</span>
        </div>
      </div>
      <div id="ch-label"></div>
    </div>
  </div>
  <div id="channels-section">
    <div id="channels-header">
      <span id="channels-title">القنوات</span>
      <button id="btn-add" onclick="toggleForm()">إضافة قناة</button>
    </div>
