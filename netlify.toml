[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/stream"
  to = "/.netlify/functions/stream"
  status = 200
