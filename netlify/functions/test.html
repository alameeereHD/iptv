<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>اختبار الروابط</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#eee;font-family:Arial,sans-serif;padding:16px}
h1{text-align:center;color:#e63946;font-size:20px;margin-bottom:16px}
#status-bar{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.stat-box{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px 16px;text-align:center;min-width:80px}
.stat-num{font-size:24px;font-weight:bold;color:#e63946}
.stat-num.ok-color{color:#2ecc71}.stat-num.fail-color{color:#e63946}.stat-num.warn-color{color:#f39c12}
.stat-label{font-size:11px;color:#888;margin-top:2px}
#controls-bar{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
#controls-bar button{padding:8px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:bold}
#btn-run{background:#e63946;color:#fff}
#btn-expand{background:#2a2a2a;color:#ccc}
#token-info{text-align:center;font-size:12px;color:#666;margin-bottom:14px}
#token-info span{color:#f39c12}
.test-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;margin-bottom:10px;overflow:hidden;transition:border-color 0.3s}
.test-card.ok{border-color:#2ecc71}.test-card.fail{border-color:#e63946}.test-card.warn{border-color:#f39c12}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer}
.card-header:hover{background:#222}
.card-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:bold}
.status-dot{width:11px;height:11px;border-radius:50%;background:#555;flex-shrink:0;transition:background 0.3s}
.test-card.ok .status-dot{background:#2ecc71;box-shadow:0 0 6px #2ecc71}
.test-card.fail .status-dot{background:#e63946;box-shadow:0 0 6px #e63946}
.test-card.warn .status-dot{background:#f39c12;box-shadow:0 0 6px #f39c12}
.test-card.loading .status-dot{background:#555;animation:pulse 0.8s infinite alternate}
@keyframes pulse{to{background:#aaa}}
.card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#888}
.badge{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:bold}
.badge.hls{background:#1a3a5c;color:#5dade2}.badge.ts{background:#3a1a1a;color:#e67e22}
.badge.http{background:#2a1a0a;color:#e59866}.badge.https{background:#0a2a1a;color:#58d68d}
.latency{font-size:12px;color:#aaa}
.latency.fast{color:#2ecc71}.latency.slow{color:#f39c12}.latency.dead{color:#e63946}
.card-body{display:none;padding:10px 14px;border-top:1px solid #2a2a2a;font-size:13px}
.card-body.open{display:block}
.url-box{background:#111;border:1px solid #333;border-radius:6px;padding:7px 10px;font-size:11px;word-break:break-all;color:#aaa;margin-bottom:8px;direction:ltr;text-align:left}
.detail-row{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:4px 0}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#888}.detail-value{color:#eee;font-weight:bold}
.detail-value.ok{color:#2ecc71}.detail-value.fail{color:#e63946}.detail-value.warn{color:#f39c12}
.mini-player{margin-top:10px;display:none}
.mini-player.open{display:block}
.mini-player video{width:100%;max-height:180px;background:#000;border-radius:6px}
.btn-play-test{margin-top:6px;padding:7px;background:#e63946;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;width:100%}
</style>
</head>
<body>
<h1>🔴 اختبار الروابط</h1>
<div id="status-bar">
  <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-label">الكل</div></div>
  <div class="stat-box"><div class="stat-num ok-color" id="stat-ok">0</div><div class="stat-label">يعمل ✓</div></div>
  <div class="stat-box"><div class="stat-num warn-color" id="stat-warn">0</div><div class="stat-label">بطيء ⚠</div></div>
  <div class="stat-box"><div class="stat-num fail-color" id="stat-fail">0</div><div class="stat-label">لا يعمل ✗</div></div>
</div>
<div id="token-info">التوكن: <span id="token-val">—</span> | يتجدد بعد: <span id="token-expiry">—</span></div>
<div id="controls-bar">
  <button id="btn-run" onclick="runAllTests()">▶ تشغيل الاختبار</button>
  <button id="btn-expand" onclick="toggleExpandAll()">⊞ توسيع الكل</button>
</div>
<div id="cards-container"></div>
<script src="proxy.js"></script>
<script src="channels.js"></script>
<script>
const results=[];
let expandedAll=false;

function buildCards(){
  const container=document.getElementById('cards-container');
  container.innerHTML='';
  results.length=0;
  const active=CHANNELS.filter(ch=>ch.url&&ch.url.trim()!=='');
  document.getElementById('stat-total').textContent=active.length;
  active.forEach((ch,i)=>{
    const isHttps=ch.url.startsWith('https://');
    const proto=isHttps?'https':'http';
    const typeTag=ch.type==='hls'?'hls':'ts';
    results.push({ch,status:'pending',latency:null,error:null});
    const card=document.createElement('div');
    card.className='test-card loading';
    card.id=`card-${i}`;
    card.innerHTML=`
      <div class="card-header" onclick="toggleCard(${i})">
        <div class="card-title"><div class="status-dot"></div><span>${ch.name}</span></div>
        <div class="card-meta">
          <span class="badge ${typeTag}">${typeTag.toUpperCase()}</span>
          <span class="badge ${proto}">${proto.toUpperCase()}</span>
          <span class="latency" id="lat-${i}">في الانتظار...</span>
        </div>
      </div>
      <div class="card-body" id="body-${i}">
        <div class="url-box">${ch.url}</div>
        <div class="detail-row"><span class="detail-label">الحالة</span><span class="detail-value" id="dv-s-${i}">جاري الفحص...</span></div>
        <div class="detail-row"><span class="detail-label">زمن الاستجابة</span><span class="detail-value" id="dv-l-${i}">—</span></div>
        <div class="detail-row"><span class="detail-label">خطأ</span><span class="detail-value fail" id="dv-e-${i}">—</span></div>
        <div class="mini-player" id="player-${i}">
          <video id="vid-${i}" muted playsinline controls></video>
          <button class="btn-play-test" onclick="testPlay(${i})">▶ اختبار التشغيل</button>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

async function testChannel(i){
  const r=results[i];
  const ch=r.ch;
  const card=document.getElementById(`card-${i}`);
  const latEl=document.getElementById(`lat-${i}`);
  const dvS=document.getElementById(`dv-s-${i}`);
  const dvL=document.getElementById(`dv-l-${i}`);
  const dvE=document.getElementById(`dv-e-${i}`);
  const mini=document.getElementById(`player-${i}`);
  card.className='test-card loading';
  latEl.className='latency';
  latEl.textContent='جاري الفحص...';
  const start=Date.now();
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),8000);
    const proxyUrl=ProxyManager.buildProxiedUrl(ch.url);
    const resp=await fetch(proxyUrl,{method:'GET',signal:controller.signal,cache:'no-store',headers:{'Range':'bytes=0-1023'}});
    clearTimeout(timeout);
    const latency=Date.now()-start;
    r.latency=latency;
    if(resp.ok||resp.status===206){
      const st=latency<800?'ok':'warn';
      r.status=st;
      card.className=`test-card ${st}`;
      latEl.className=`latency ${latency<800?'fast':'slow'}`;
      latEl.textContent=`${latency} ms`;
      dvS.className=`detail-value ${st}`;
      dvS.textContent=`✓ يعمل (${resp.status})`;
      dvL.textContent=`${latency} ms`;
      dvE.textContent='—';
      mini.classList.add('open');
    } else { throw new Error(`HTTP ${resp.status}`); }
  } catch(err){
    const latency=Date.now()-start;
    r.latency=latency; r.status='fail';
    r.error=err.name==='AbortError'?'انتهت المهلة':err.message;
    card.className='test-card fail';
    latEl.className='latency dead'; latEl.textContent='لا يستجيب';
    dvS.className='detail-value fail'; dvS.textContent='✗ لا يعمل';
    dvL.textContent=`${latency} ms`; dvE.textContent=r.error;
  }
  updateStats();
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

async function testPlay(i){
  if(!window.Hls) await loadScript('https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js');
  if(!window.mpegts) await loadScript('https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js');
  const ch=results[i].ch;
  const vid=document.getElementById(`vid-${i}`);
  const url=ProxyManager.buildProxiedUrl(ch.url);
  if(vid._hls){vid._hls.destroy();}
  if(vid._mpts){vid._mpts.destroy();}
  if(ch.type==='hls'||ch.url.includes('.m3u8')){
    if(Hls.isSupported()){const hls=new Hls();hls.loadSource(url);hls.attachMedia(vid);hls.on(Hls.Events.MANIFEST_PARSED,()=>vid.play().catch(()=>{}));vid._hls=hls;}
    else{vid.src=url;vid.play().catch(()=>{});}
  } else {
    const p=mpegts.createPlayer({type:'mpegts',url,isLive:true});p.attachMediaElement(vid);p.load();p.play().catch(()=>{});vid._mpts=p;
  }
}

async function runAllTests(){
  buildCards();
  document.getElementById('token-val').textContent=ProxyManager.getToken().slice(0,10)+'...';
  document.getElementById('token-expiry').textContent=ProxyManager.minutesLeft()+' دقيقة';
  for(let i=0;i<results.length;i+=3){
    await Promise.all(results.slice(i,i+3).map((_,j)=>testChannel(i+j)));
  }
}

function updateStats(){
  document.getElementById('stat-ok').textContent=results.filter(r=>r.status==='ok').length;
  document.getElementById('stat-warn').textContent=results.filter(r=>r.status==='warn').length;
  document.getElementById('stat-fail').textContent=results.filter(r=>r.status==='fail').length;
}

function toggleCard(i){document.getElementById(`body-${i}`).classList.toggle('open');}

function toggleExpandAll(){
  expandedAll=!expandedAll;
  results.forEach((_,i)=>{const b=document.getElementById(`body-${i}`);if(b)expandedAll?b.classList.add('open'):b.classList.remove('open');});
  document.getElementById('btn-expand').textContent=expandedAll?'⊟ طي الكل':'⊞ توسيع الكل';
}

window.addEventListener('DOMContentLoaded',()=>{ProxyManager.startAutoRenew();});
</script>
</body>
</html>
